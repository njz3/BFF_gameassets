# Controles de l image Racecab pour windowsloader : le panneau de la borne,
# vu par SDL. Meme convention que linuxloader et Supermodel :
#   bouton 1 piece -> BUTTON_0   bouton 2 test    -> BUTTON_1
#   bouton 3 service -> BUTTON_2 bouton 4 depart  -> BUTTON_3
#   boutons 9 et 10 = vitesses   -> BUTTON_8 et BUTTON_9
#   axe X volant, Y accelerateur, Z frein ; les deux pedales sur le
#   COTE NEGATIVE de leur axe (repos au centre), comme JOY1_YAXIS_NEG.
#
# Le defaut de windowsloader laissait piece et depart au clavier et posait
# les pedales sur les gachettes d une manette GameController, que vJoy
# n est pas : sans ce fichier, la borne n a ni piece, ni depart, ni pedales.
#
# Pas de liaison clavier pour le volant ni les pedales : avec linuxloader,
# elles figeaient gaz et frein sur la borne (Tokyo Cop, 25/10/2026).
#
[Common]
Test = KEY_T, JOY0_BUTTON_1
P1_Coin = KEY_5, JOY0_BUTTON_0
P1_Start = KEY_1, GC0_BUTTON_START, JOY0_BUTTON_3
P1_Service = KEY_S, JOY0_BUTTON_2

[Driving]
ViewChange = KEY_V, GC0_BUTTON_Y, JOY0_BUTTON_4
Handbrake = KEY_Space, GC0_BUTTON_X, JOY0_BUTTON_5
GearUp = KEY_A, GC0_BUTTON_RIGHTSHOULDER, JOY0_BUTTON_8
GearDown = KEY_Z, GC0_BUTTON_LEFTSHOULDER, JOY0_BUTTON_9
Hazard = KEY_H
Overtake = KEY_O, GC0_BUTTON_DPADUP
Nitro = KEY_N, GC0_BUTTON_A
ShiftNitro = KEY_J
Action = KEY_C
Item = KEY_I, JOY0_BUTTON_6
SelectUp = KEY_PageUp
SelectDown = KEY_PageDown
SelectLeft = KEY_Home
SelectRight = KEY_End
SelectEnter = KEY_Return
View1 = KEY_B, GC0_BUTTON_A
View2 = KEY_N, GC0_BUTTON_B
View3 = KEY_M, GC0_BUTTON_X
View4 = KEY_Comma, GC0_BUTTON_Y
Gear1 = KEY_Q
Gear2 = KEY_W
Gear3 = KEY_E
Gear4 = KEY_R
Gear5 = KEY_Y
Gear6 = KEY_U
P1_Clutch_Digital = KEY_X
P1_Steer = GC0_AXIS_LEFTX, JOY0_AXIS_0
P1_Gas = GC0_AXIS_RIGHTTRIGGER, JOY0_AXIS_1_NEGATIVE_SIDE
P1_Brake = GC0_AXIS_LEFTTRIGGER, JOY0_AXIS_2_NEGATIVE_SIDE
P1_Steer_Left=KEY_Left
P1_Steer_Right=KEY_Right
P1_Gas_Digital=KEY_Up
P1_Brake_Digital=KEY_Down
PedalLeft=KEY_Z, GC0_BUTTON_LEFTSHOULDER
PedalRight=KEY_X, GC0_BUTTON_RIGHTSHOULDER

[ControllerGUIDs]
[Config]
Steer_DeadZone=500
Gas_DeadZone=500
Brake_DeadZone=500
FFB_Strength=100
FFB_Invert=0
FFB_Device=AUTO
