# Controles de l image Racecab pour windowsloader : le panneau de la borne,
# vu par SDL. Meme convention que linuxloader et Supermodel :
#   bouton 1 piece -> BUTTON_0   bouton 2 test    -> BUTTON_1
#   bouton 3 service -> BUTTON_2 bouton 4 depart  -> BUTTON_3
#   boutons 9 et 10 = vitesses   -> BUTTON_8 et BUTTON_9
#   axe X volant, Y accelerateur, Z frein ; les deux pedales sur le
#   COTE NEGATIVE de leur axe (repos au centre), comme JOY1_YAXIS_NEG.
#
# Le defaut de windowsloader laissait piece et depart au clavier et posait
# les pedales sur les gachettes d une manette GameController, que vJoy
# n est pas : sans ce fichier, la borne n a ni piece, ni depart, ni pedales.
#
# Pas de liaison clavier pour le volant ni les pedales : avec linuxloader,
# elles figeaient gaz et frein sur la borne (Tokyo Cop, 25/10/2026).
#
[Common]
# The cabinet's test button (the game's test menu). Default: KEY_F2
Test = KEY_F2, JOY0_BUTTON_1

# Player 1's coin. Default: KEY_5
P1_Coin = KEY_5, JOY0_BUTTON_0

# Player 1's start button. Default: KEY_1, GC0_BUTTON_START
P1_Start =JOY0_BUTTON_3, KEY_1

# Player 1's service button. Default: KEY_9
P1_Service = KEY_9, JOY0_BUTTON_2
# Quitter le jeu (20261028-4) : Echap seulement, choix du proprietaire du
# 28/10/2026 - on quitte au clavier, jamais par un bouton du panneau.
ExitGame = KEY_Escape

[Driving]
# Changes the view (Sega Rally 3, Daytona...). Default: KEY_V, GC0_BUTTON_Y
ViewChange = KEY_V, GC0_BUTTON_Y, JOY0_BUTTON_4

# Handbrake (Sega Rally 3, Battle Gear 4...). Default: KEY_Space, GC0_BUTTON_X
Handbrake = KEY_Space, GC0_BUTTON_X, JOY0_BUTTON_5

# Gear up, sequential shifter. Default: KEY_A, GC0_BUTTON_RIGHTSHOULDER
GearUp = KEY_A, GC0_BUTTON_RIGHTSHOULDER, JOY0_BUTTON_8

# Gear down, sequential shifter. Default: KEY_Z, GC0_BUTTON_LEFTSHOULDER
GearDown = KEY_Z, GC0_BUTTON_LEFTSHOULDER, JOY0_BUTTON_9

# Hazard lights button (Taito games: Battle Gear 4...). Default: KEY_H
Hazard = KEY_H

# Overtake button (Taito games). Default: KEY_O, GC0_BUTTON_DPADUP
Overtake = KEY_O, GC0_BUTTON_DPADUP

# Nitro or boost button. Default: KEY_N, GC0_BUTTON_A
Nitro =JOY0_BUTTON_4, KEY_N

# Nitro on the shifter (Taito games). Default: KEY_J
ShiftNitro = KEY_J

# The game's action button: an item, a weapon (GTI Club 3, Mario Kart DX). Default: KEY_C
Action =JOY0_BUTTON_5, KEY_C
Item =JOY0_BUTTON_6

# Selection up, in the menus of the games that have selection buttons. Default: KEY_PageUp
SelectUp =KEY_PageUp, JOY0_BUTTON_9

# Selection down. Default: KEY_PageDown
SelectDown =KEY_PageDown, JOY0_BUTTON_8

# Selection left. Default: KEY_Home
SelectLeft = KEY_Home

# Selection right. Default: KEY_End
SelectRight = KEY_End

# Selection confirmed. Default: KEY_Return
SelectEnter = KEY_Return

# View button 1, red (Daytona, Initial D...). Default: KEY_B, GC0_BUTTON_A
View1 = KEY_B, GC0_BUTTON_A

# View button 2, blue (Daytona, Initial D...). Default: KEY_N, GC0_BUTTON_B
View2 = KEY_N, GC0_BUTTON_B

# View button 3, yellow (Daytona, Initial D...). Default: KEY_M, GC0_BUTTON_X
View3 = KEY_M, GC0_BUTTON_X

# View button 4, green (Daytona, Initial D...). Default: KEY_Comma, GC0_BUTTON_Y
View4 = KEY_Comma, GC0_BUTTON_Y

# H shifter, 1st gear (held while in gear). Default: KEY_Q
Gear1 = KEY_Q

# H shifter, 2nd gear. Default: KEY_W
Gear2 = KEY_W

# H shifter, 3rd gear. Default: KEY_E
Gear3 = KEY_E

# H shifter, 4th gear. Default: KEY_R
Gear4 = KEY_R

# H shifter, 5th gear. Default: KEY_Y
Gear5 = KEY_Y

# H shifter, 6th gear. Default: KEY_U
Gear6 = KEY_U

# The clutch pressed fully, as a button. Default: KEY_X
P1_Clutch_Digital = KEY_X

# The steering wheel, an axis turned left to right (a gamepad's left stick, else the first
# controller's X). Default: GC0_AXIS_LEFTX, JOY0_AXIS_0
P1_Steer = GC0_AXIS_LEFTX, JOY0_AXIS_0

# The accelerator pedal: a gamepad's right trigger, else the first controller's Y from its middle
# (released) to its low end (pressed), as BackForceFeeder's vJoy. Default: GC0_AXIS_RIGHTTRIGGER,
# JOY0_AXIS_1_NEGATIVE_SIDE
P1_Gas = GC0_AXIS_RIGHTTRIGGER, JOY0_AXIS_1_NEGATIVE_SIDE

# The brake pedal: a gamepad's left trigger, else the first controller's Z from its middle (released)
# to its low end (pressed). Default: GC0_AXIS_LEFTTRIGGER, JOY0_AXIS_2_NEGATIVE_SIDE
P1_Brake = GC0_AXIS_LEFTTRIGGER, JOY0_AXIS_2_NEGATIVE_SIDE

# The steering wheel turned fully left, as a button. Default: KEY_Left
P1_Steer_Left=KEY_Left

# The steering wheel turned fully right, as a button. Default: KEY_Right
P1_Steer_Right=KEY_Right

# The accelerator pressed fully, as a button. Default: KEY_Up, KEY_LCtrl
P1_Gas_Digital=KEY_Up, KEY_LCtrl

# The brake pressed fully, as a button. Default: KEY_Down
P1_Brake_Digital=KEY_Down

# Left foot pedal of a motorbike (Frenzy Express). Default: KEY_Z, GC0_BUTTON_LEFTSHOULDER
PedalLeft=KEY_Z, GC0_BUTTON_LEFTSHOULDER

# Right foot pedal of a motorbike (Frenzy Express). Default: KEY_X, GC0_BUTTON_RIGHTSHOULDER
PedalRight=KEY_X, GC0_BUTTON_RIGHTSHOULDER

# The four colour buttons of Sega World Drivers Championship's panel (vJoy 13-16). Default: KEY_D
P1_Yellow = KEY_D, JOY0_BUTTON_12

# Default: KEY_F
P1_Green = KEY_F, JOY0_BUTTON_13

# Default: KEY_G
P1_Blue = KEY_G, JOY0_BUTTON_14

# Default: KEY_L
P1_Red = KEY_L, JOY0_BUTTON_15

# Puts the player's NESYS entry key in the cabinet's reader, or takes it out (Battle Gear 4
# Tuned). Default: KEY_K
EntryKey = KEY_K

# The clutch pedal (Battle Gear 4 Tuned's Pro cabinet): an axis, as the brake's (JOY0_AXIS_3_NEGATIVE_SIDE:
# the first controller's fourth axis from its middle to its low end). Default: none, the clutch
# taken from P1_Clutch_Digital; bound with "Lier" on the controller's page
P1_Clutch =

[ControllerGUIDs]
[Config]
# Dead zone of the steering wheel's axis, 0 to 32767 (32767 is the whole axis). Default: 500
Steer_DeadZone=500

# Dead zone of the accelerator pedal's axis, 0 to 32767. Default: 500
Gas_DeadZone=500

# Dead zone of the brake pedal's axis, 0 to 32767. Default: 500
Brake_DeadZone=500

# Force feedback strength, in percent of the game's force. Default: 100
FFB_Strength=100

# 1 turns the force feedback's direction over, for a wheel that pushes the wrong way. Default: 0
FFB_Invert=0

# The device the force feedback goes to: AUTO (player 1's wheel) or a device's name as the system
# gives it ("vJoy Device"); while it is not connected, player 1's wheel. Default: AUTO
FFB_Device=AUTO
