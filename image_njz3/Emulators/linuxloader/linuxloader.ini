# Linux Loader Configuration File
# By the Linux Loader Development Team 2026
# Reglages de l image Racecab. Tout le reste est le defaut de linuxloader v3.0.12.
#
# OUTPUTS_NETWORK = true en permanence : le chargeur envoie TOUJOURS les octets
# de la drive board emulee a BackForceFeeder, en TCP sur le port 8000, en plus
# des effets ressentis par la roue. C est BFF qui choisit lequel des deux il
# utilise, selon le profil que lui designe le titre de la fenetre : [jeu] pour
# le mode normal, [jeu_raw] pour le mode brut. Les reglages sont donc les memes
# dans les deux modes, exactement comme pour Supermodel.
#
# WRITE_DIR reste VIDE ici : c est RunLinuxLoaderGame.cmd qui passe --write-dir
# quand Utils\set_writedir.bat le demande, pour que la bascule reste au meme
# endroit que pour les autres emulateurs.
#
# GENERE par Utils\config\Build-Config.ps1 a partir de linuxloader.ini.template :
# c est le gabarit qu il faut modifier. Avec un dossier d ecriture (WRITEDIR_ROOT),
# linuxloader lit la copie de ce fichier faite dans Saves\linuxloader_<identite> ;
# Build-Config efface les copies qui ne sont plus a jour, il les refait depuis
# celui-ci. Un "Save" du menu Tab (ecrit dans la copie) est donc perdu au
# Build-Config suivant.
#
# DISPLAY_MODE suit la resolution (colonne MODE_FENETRE de resolutions.csv) :
# BORDERLESS, ou BORDERLESS_STRETCH en super-resolution. Plus passe en ligne de
# commande (plus de linuxloader_video_options.bat depuis le 27/10/2026).
#
# DISPLAY_MODE = BORDERLESS : fenetre sans bordure a la resolution du bureau
# (choix du proprietaire). Elle ne se reduit pas quand elle perd le focus,
# contrairement au plein ecran exclusif, et ne change pas le mode de l ecran.
#

[Display]
# Set the width resolution here
WIDTH = AUTO

# Set the height resolution here
HEIGHT = AUTO

# Boost render resolution in HOD4/2Spicy/Harley/Rambo/HOD-EX/ID4/ID5 and LGJ
BOOST_RENDER_RES = true

# Set to true for full screen
FULLSCREEN = false

# Shape of the picture: ORIGINAL (the game's render resolution); 4:3 or 16:9 (that frame, the picture whole
# inside at its own shape, black bars where the shapes differ; 4:3_LETTERBOX is 4:3); 4:3_STRETCH or 16:9_STRETCH
# (the picture fills the frame, deformed); 4:3_CROP or 16:9_CROP (the picture fills the frame, cut on the
# sides or above and below)
ASPECT_RATIO = ORIGINAL

# The part a cropped aspect ratio keeps: -100 (left or top) to 100 (right or bottom), 0 the middle
CROP_POSITION = 0

# Cropped aspect ratios: true bends the parts they would cut onto the frame's edges, as on a cylinder seen from
# the front, so the whole picture stays visible. BARREL_CENTER: the middle shown undistorted, in % of the frame.
# BARREL_RADIUS: the cylinder's radius in % of the frame (small bends hard at the edge, large compresses evenly)
CROP_BARREL = false
BARREL_CENTER = 60
BARREL_RADIUS = 50

# WINDOW (window at the aspect ratio, square pixels), WINDOW_STRETCH (the picture fills the window),
# FULLSCREEN (full screen at the aspect ratio, the screen set to the game's resolution), FULLSCREEN_STRETCH
# (the picture fills the screen), BORDERLESS (a borderless window over the screen at the desktop's resolution,
# the aspect ratio) or BORDERLESS_STRETCH (the picture fills it).
# Takes over FULLSCREEN when set.
DISPLAY_MODE = BORDERLESS

# Set to true if you'd like to add a border for optical light gun tracking
BORDER_ENABLED = false

# Set the thickness of the white border as a percentage of the width of the screen
WHITE_BORDER_PERCENTAGE = 2.0

# Set the thickness of the black border which sits around the
# white border as a percentage of the width of the screen
BLACK_BORDER_PERCENTAGE = 0.0

# Set to keep the aspect ratio in games like Sega Race TV Primeval Hunt and LGJ-SP
KEEP_ASPECT_RATIO = true

# Set to true to enable the mouse pointer/Cursor
HIDE_CURSOR = true

# Set to false if you don't want to limit the FPS
FPS_LIMITER_ENABLED = true

# Set the target FPS (will only work if FPS_LIMITER_ENABLED = 1)
FPS_TARGET = 60.0

# Set to true to enable the FPS overlay
FPS_OVERLAY_ENABLED = false

# Set the position of the FPS overlay (0: TOP_LEFT, 1: TOP_RIGHT, 2: BOTTOM_LEFT, 3: BOTTOM_RIGHT)
FPS_OVERLAY_POSITION = 0

[Input]
# Sets the Input Mode (1: SDL, 2: EVDEV
INPUT_MODE = 1

[Emulation]
# Set the Region (JP/US/EX)
REGION = EX

# Set to true for Free Play, none to leave as default
FREEPLAY = none

# Set to true to emulate JVS and use the keyboard/mouse for controls.
# If this is set to false, the loader will route the traffic to the serial device
# defined in JVS_PATH if it has been defined.
EMULATE_JVS = true

# Set to true to emulate the rideboard used in the SPECIAL games
# If this is set to false, then the emulator will route the traffic to one of the serial ports
EMULATE_RIDEBOARD = AUTO

# Set to true to emulate the driveboard used in driving games
# If this is set to false, then the emulator will route the traffic to one of the serial ports
EMULATE_DRIVEBOARD = AUTO

# Set to true to emulate the motion board from Outrun 2 SP SDX
# If this is set to false, then the emulator will route the traffic to one of the serial ports
EMULATE_MOTIONBOARD = AUTO

# Set to true to enable card reader emulation in Virtua Tennis 3 or R-Tuned
EMULATE_HW210_CARDREADER = AUTO

# Set to true to enable card reader emulation in ID4 and ID5 file 
EMULATE_ID_CARD_READER = AUTO

# Set to true to enable touchscreen emulation  with the mouse
EMULATE_TOUCHSCREEN = AUTO

[Cards]
# Set to false to use a button to insert a card manually in ID4 or ID5.
# Or true to make the loader auto load
ID_CARDFILE_AUTOLOAD = true

# Card File for reader 1 in VT3 or R-Tuned; Maximum Tune 3's card (the card emulators' .RAW text, the
# CardInsert key offers it to the card reader-printer)
CARDFILE_01 = "Card_01.crd"

# Card File for reader 2 in VT3 or R-Tuned
CARDFILE_02 = "Card_02.crd"

# Folder for ID Card files
ID_CARDFOLDER = ""

[Paths]
# Define the path to pass the JVS packets to if JVS is not being emulated
JVS_PATH = "/dev/ttyUSB0"

# Define the path to pass the first serial port to
SERIAL_1_PATH = "/dev/ttyS0"

# Define the path to pass the second serial port to
SERIAL_2_PATH = "/dev/ttyS1"

# Define the path to the sram.bin file
SRAM_PATH = "sram.bin"

# Define the path to the eeprom.bin file
EEPROM_PATH = "eeprom.bin"

# Windows: the folder everything is written to (or --write-dir); the loader's and the game's folders are then
# only read. Its root holds linuxloader.ini and controls.ini (copied there the first time), WRITE_DIR\<game>
# the NVRAM, saves, logs, temporary files and compiled shaders; for a write filter (UWF) or games on a share.
# For Example: C:\Racecab\Saves\linuxloader\single
WRITE_DIR = ""

# If set, libCG.so needed for 2Spicy, Harley, Rambo and HOD-Ex shader recompilation
# will be loaded from the specified location. (include the name of file in the location For Example: /my/file/location/myLibCg.so)
LIBCG_PATH = ""

[Graphics]
# Set to true if you experience flickering in hummer
HUMMER_FLICKER_FIX = false

# Set to true if you want to render LGJ using the mesa patches
LGJ_RENDER_WITH_MESA = true

# Disable to use the original fonts instead of the built in font
DISABLE_BUILTIN_FONT = false

# Disable to use the original logos instead of the built in logos
DISABLE_BUILTIN_LOGOS = false

[Cursor]
# If true, a custom mouse cursor will be used loaded from a png file set in CUSTOM_CURSOR
# Ovewrites HIDE_CURSOR
CUSTOM_CURSOR_ENABLED = false

# Set the custom mouse pointer from a PNG file (Usefull for shooting games)
CUSTOM_CURSOR = ""

# Set the width of the custom cursor
CUSTOM_CURSOR_WIDTH = 32

# Set the height of the custom cursor
CUSTOM_CURSOR_HEIGHT = 32

# Set a custom cursor for the touch screen in Primeval Hunt, MJ4 Games and AxA Games
TOUCH_CURSOR = ""

# Set the width of the custom cursor
TOUCH_CURSOR_WIDTH = 32

# Set the height of the custom cursor
TOUCH_CURSOR_HEIGHT = 32

[GameSpecific]
# Set Primeval Hunt
# Mode 0: Default (no scaling)
# Mode 1: No Touch screen
# Mode 2: Side By Side
# Mode 3: 3ds mode 1 (Touch screen to the right)
# Mode 4: 3ds mode 2 (Touch screen to the bottom)
PRIMEVAL_HUNT_SCREEN_MODE = 2

# Set Primeval Hunt Test mode screen to single screen
PRIMEVAL_HUNT_TEST_SCREEN_SINGLE = true

# Set to true to make Primeval Hunt use a special opengl.dll to fix the graphic glitches.
PRIMEVAL_HUNT_USE_ZINK = true

# Set to true to bypass cabinet checks including drive board and tower in Outrun 2 SP SDX
SKIP_OUTRUN_CABINET_CHECK = false

# Hacky way to make MJ4 and AxA work at prohibited times
MJ4_ENABLED_ALL_THE_TIME = false

# House of the dead 4 speed fix, set the frequency of your CPU in Ghz
CPU_FREQ_GHZ = 0.0

# Set to true if you want to chnge the way the guns are show in Rambo
RAMBO_GUNS_SWITCH = false

# Set to true if you want to enable analog swapping of the steering wheel and Gas for Harley for JVS Passthrough
HARLEY_ANALOG_REMAP = false

# Set to true to set the language in Chinese for ID5 DVP-0084 and DVP-0084A
ID5_CHINESE_LANGUAGE = false

# Set the percentage of the steering wheel travel reduction
ID_STEERING_REDUCTION_PERCENTAGE = 0.0

[CrossHairs]
# Set to true to enable Crosshairs even when using GunLights
ENABLE_CROSSHAIRS = false

# Set the Crosshair image from a PNG file for Player 1
P1_CROSSHAIR_PATH = ""

# Set the Crosshair image from a PNG file for Player 2
P2_CROSSHAIR_PATH = ""

# Set the width of the Crosshair image
CUSTOM_CROSSHAIRS_WIDTH = 64

# Set the height of the Crosshair image
CUSTOM_CROSSHAIRS_HEIGHT = 64

# Set to true to always enable Crosshairs in Ghost Squad Evolution
GSEVO_CROSSHAIR_ALWAYS_ON = false

# Set to true to always disable Crosshairs in Ghost Squad Evolution
GSEVO_CROSSHAIR_ALWAYS_OFF = false

[System]
# Set to true to see debug messages in the console
DEBUG_MSGS = false

# Set the colour of the lindbergh (YELLOW, RED, BLUE, SILVER, REDEX)
LINDBERGH_COLOUR = YELLOW

[Outputs]
# Set to true to send lamps and drive board data over the network, MAME style (BackForceFeeder, MAMEHooker...)
OUTPUTS_NETWORK = true

# TCP port the outputs server listens on
OUTPUTS_NETWORK_PORT = 8000

# UDP port on 127.0.0.1 that gets a start announcement (0 to disable)
OUTPUTS_NETWORK_UDP_PORT = 8001

[ForceFeedback]
# Strength of the drive board forces on a force feedback wheel, in percent of the board's full scale
FFB_STRENGTH = 100
# Set to true if the wheel turns the wrong way: the torque then pushes the other way
FFB_INVERT = false

[Launcher]
# Folder the game picker lists when linuxloader starts without a game (empty: games next to the program)
GAMES_DIR = C:\Racecab\Games

# Language of the picker and of the F10 settings: auto, en or fr
LANGUAGE = auto

[Network]
# If true, the loader will apply the following network patches depending on the game
ENABLE_NETWORK_PATCHES = true

# Sets the name of the Network Interface Card
NIC_NAME = "enp0s1"

# ID4 and ID5 network configuration per seat
ID_IP_SEAT_1 = "192.168.1.2"
ID_IP_SEAT_2 = "192.168.1.3"

# Sets the IP address and Netmask for Outrun link (you have to put your NIC ip)
OR2_IPADDRESS = "192.168.1.2"
OR2_NETMASK = "255.255.255.0"

# Harley / Hummer and R-Tuned IP address for each Cabinet
IP_CAB1 = "192.168.1.2"
IP_CAB2 = "192.168.1.3"
IP_CAB3 = "192.168.1.4"
IP_CAB4 = "192.168.1.5"

# Sets the IP address of each cabinet for network play in 2Spicy
2SPICY_IP_CAB1 = "192.168.1.2"
2SPICY_IP_CAB2 = "192.168.1.3"

# Sets the IP address for SRTV
SRTV_IPADDRESS = ""

