# The emulator's commands
[Emulator]

# Pauses and resumes the game
# Default: KEY_F5, KEY_P, GC0_BUTTON_GUIDE + GC0_BUTTON_X
Pause = KEY_F5, KEY_P, GC0_BUTTON_GUIDE + GC0_BUTTON_X

# Saves the state, as the latest of the five kept
# Default: KEY_F6, GC0_BUTTON_GUIDE + GC0_BUTTON_RIGHTSHOULDER
SaveState = KEY_F6, GC0_BUTTON_GUIDE + GC0_BUTTON_RIGHTSHOULDER

# Loads the state chosen, the latest by default
# Default: KEY_F7, GC0_BUTTON_GUIDE + GC0_BUTTON_LEFTSHOULDER
