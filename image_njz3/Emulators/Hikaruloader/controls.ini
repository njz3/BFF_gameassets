# Hikaruloader's controls, in linuxloader's syntax (windowsloader's too).
# Written by the Controls page (Tab, Controls): each change writes the whole
# file again, these comments with it; comments of your own would be lost.
# A line left out takes its default, given above it.
#
# ACTION = BINDING, BINDING...    any of them; A + B: both held together
#   KEY_<name>                    a key, by SDL's name: KEY_F5, KEY_Return...
#   JOY<n>_BUTTON_<b>             button b of controller n, from 0 as SDL
#                                 counts (the page can show them from 1)
#   JOY<n>_HAT<h>_<UP|DOWN|LEFT|RIGHT>
#   JOY<n>_AXIS_<a>               an axis
#   GC<n>_BUTTON_<name>           a game controller's button: A, B, X, Y,
#                                 START, BACK, DPUP, LEFTSHOULDER...
#   GC<n>_AXIS_<name>             its axis: LEFTX, LEFTY, RIGHTX, RIGHTY,
#                                 LEFTTRIGGER, RIGHTTRIGGER
# After an axis: _POSITIVE or _NEGATIVE, half the axis as a button;
#   _POSITIVE_SIDE or _NEGATIVE_SIDE, half the axis as a pedal (at rest in
#   the middle); _INVERTED, the axis the other way round.
# <n> is the player's controller, from 0: JOY0 is [ControllerGUIDs] P1_GUID's
#   (GC0 too when SDL knows it as a game controller); the others follow in
#   SDL's order.
# Hotkeys, as RetroArch has them: GC<n>_BUTTON_GUIDE + GC<n>_BUTTON_<name>.
#   While a game controller's Guide is held, its buttons and its hat are the
#   hotkeys' alone: the game sees none of them (a button pressed then stays
#   hidden until let go).

# Dead zones, 0 to 32767: the part of the wheel's travel around its middle,
# or of a pedal's from its rest, read as nothing
[Config]

# The steering wheel's dead zone; default: 500
Steer_DeadZone = 500

# The accelerator's dead zone; default: 500
Gas_DeadZone = 500

# The brake's dead zone; default: 500
Brake_DeadZone = 500

# The cabinet's switches, in every game
[Common]

# The Test button; default: KEY_F5
Test = KEY_F5, JOY0_BUTTON_1

# The Service button; default: KEY_F6
P1_Service = KEY_F6, JOY0_BUTTON_2

# Coin 1; default: KEY_5
P1_Coin = KEY_5, JOY0_BUTTON_0

# Coin 2; default: KEY_6
P2_Coin = KEY_6

# Start; default: KEY_Return, GC0_BUTTON_START
P1_Start = KEY_Return, GC0_BUTTON_START, JOY0_BUTTON_3

# Quits the emulator (Guide + Start on a controller)
# Default: KEY_F9, GC0_BUTTON_GUIDE + GC0_BUTTON_START
ExitGame = KEY_F9, GC0_BUTTON_GUIDE + GC0_BUTTON_START

# Player 1's stick and buttons
[Digital]

# Up; default: KEY_Up, GC0_BUTTON_DPUP, GC0_AXIS_LEFTY_NEGATIVE, JOY0_HAT0_UP
P1_Up = KEY_Up, GC0_BUTTON_DPUP, GC0_AXIS_LEFTY_NEGATIVE, JOY0_HAT0_UP

# Down
# Default: KEY_Down, GC0_BUTTON_DPDOWN, GC0_AXIS_LEFTY_POSITIVE, JOY0_HAT0_DOWN
P1_Down = KEY_Down, GC0_BUTTON_DPDOWN, GC0_AXIS_LEFTY_POSITIVE, JOY0_HAT0_DOWN

# Left
# Default: KEY_Left, GC0_BUTTON_DPLEFT, GC0_AXIS_LEFTX_NEGATIVE, JOY0_HAT0_LEFT
P1_Left = KEY_Left, GC0_BUTTON_DPLEFT, GC0_AXIS_LEFTX_NEGATIVE, JOY0_HAT0_LEFT, JOY0_BUTTON_5

# Right
# Default: KEY_Right, GC0_BUTTON_DPRIGHT, GC0_AXIS_LEFTX_POSITIVE, JOY0_HAT0_RIGHT
P1_Right = KEY_Right, GC0_BUTTON_DPRIGHT, GC0_AXIS_LEFTX_POSITIVE, JOY0_HAT0_RIGHT, JOY0_BUTTON_6

# Button 1; default: KEY_LeftCtrl, GC0_BUTTON_A
P1_Button1 = KEY_LeftCtrl, GC0_BUTTON_A, JOY0_BUTTON_4

# Button 2; default: KEY_LeftAlt, GC0_BUTTON_B
P1_Button2 = KEY_LeftAlt, GC0_BUTTON_B, JOY0_AXIS_2_NEGATIVE

# Button 3; default: KEY_LeftShift, GC0_BUTTON_X
P1_Button3 = KEY_LeftShift, GC0_BUTTON_X

# Button 4; default: KEY_Z, GC0_BUTTON_Y
P1_Button4 = KEY_Z, GC0_BUTTON_Y

# The card, at the card reader's slot (Virtual-On 4), or taken back
# Default: KEY_F7, GC0_BUTTON_GUIDE + GC0_BUTTON_Y
P1_Card1Insert = KEY_F7, GC0_BUTTON_GUIDE + GC0_BUTTON_Y

# The wheel and the pedals: the I/O board's analog channels 0, 1 and 2
[Driving]

# The steering wheel: an axis, to the left negative. hikaruloader.ini's
# [Input] WHEEL_ROTATION sets how far a wheel turns for the game's
# Default: GC0_AXIS_LEFTX, JOY0_AXIS_0
P1_Steer = GC0_AXIS_LEFTX, JOY0_AXIS_0

# The accelerator: a trigger, an axis or half of one
# Default: GC0_AXIS_RIGHTTRIGGER, JOY0_AXIS_1_NEGATIVE_SIDE
P1_Gas = GC0_AXIS_RIGHTTRIGGER, JOY0_AXIS_1_NEGATIVE_SIDE

# The brake: a trigger, an axis or half of one
# Default: GC0_AXIS_LEFTTRIGGER, JOY0_AXIS_2_NEGATIVE_SIDE
P1_Brake = GC0_AXIS_LEFTTRIGGER, JOY0_AXIS_2_NEGATIVE_SIDE

# The wheel turned all the way to the left; default: KEY_Left
P1_Steer_Left = KEY_Left

# The wheel turned all the way to the right; default: KEY_Right
P1_Steer_Right = KEY_Right

# The accelerator pressed all the way; default: KEY_Up
P1_Gas_Digital = KEY_Up

# The brake pressed all the way; default: KEY_Down
P1_Brake_Digital = KEY_Down
GearUp = KEY_PageUp, GC0_BUTTON_RIGHTSHOULDER, JOY0_BUTTON_8
GearDown = KEY_PageDown, GC0_BUTTON_LEFTSHOULDER, JOY0_BUTTON_9
# NASCAR's view change (vJoy 5), hikaruloader 0.4.2 and later
ViewChange = KEY_V, GC0_BUTTON_Y, JOY0_BUTTON_4

# The Gaelco cabinets' own buttons (ATV Track, Smashing Drive), hikaruloader
# 0.5.1 and later; they read no [Digital] row. vJoy 13/14 the volume, vJoy 5/6
# ATV Track's brake levers, vJoy 5 Smashing Drive's horn (07/11/2026)
[Gaelco]

VolumeUp = KEY_PageUp, GC0_BUTTON_DPUP, JOY0_BUTTON_12
VolumeDown = KEY_PageDown, GC0_BUTTON_DPDOWN, JOY0_BUTTON_13
LeftBrake = KEY_LeftCtrl, GC0_BUTTON_LEFTSHOULDER, JOY0_BUTTON_4
RightBrake = KEY_LeftAlt, GC0_BUTTON_RIGHTSHOULDER, JOY0_BUTTON_5
Horn = KEY_LeftShift, GC0_BUTTON_X, JOY0_BUTTON_4

# The emulator's commands: Hikaruloader's own section, the other loaders
# leave it alone
[Emulator]

# Pauses and resumes the game
# Default: KEY_Space, GC0_BUTTON_GUIDE + GC0_BUTTON_X
Pause = KEY_Space, GC0_BUTTON_GUIDE + GC0_BUTTON_X

# Saves the state; default: KEY_F4, GC0_BUTTON_GUIDE + GC0_BUTTON_RIGHTSHOULDER
SaveState = KEY_F4, GC0_BUTTON_GUIDE + GC0_BUTTON_RIGHTSHOULDER

# Loads the state; default: KEY_F1, GC0_BUTTON_GUIDE + GC0_BUTTON_LEFTSHOULDER
LoadState = KEY_F1, GC0_BUTTON_GUIDE + GC0_BUTTON_LEFTSHOULDER

# Opens and closes the settings
# Default: KEY_Tab, GC0_BUTTON_BACK, GC0_BUTTON_GUIDE + GC0_BUTTON_BACK
Menu = KEY_Tab, GC0_BUTTON_BACK, GC0_BUTTON_GUIDE + GC0_BUTTON_BACK

# Back to the picker the game was started from, else quits
# Default: KEY_Escape, GC0_BUTTON_GUIDE + GC0_BUTTON_B
Back = KEY_Escape, GC0_BUTTON_GUIDE + GC0_BUTTON_B

# Shows and hides the frame rate; default: KEY_F12
ShowFps = KEY_F12

# P<n>_GUID = an SDL joystick GUID: that controller is player n's, JOY<n-1>,
# whatever order Windows lists them in (hikaruloader.log gives the GUIDs)
[ControllerGUIDs]
