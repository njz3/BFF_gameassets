# Shows and hides the frame rate; default: KEY_F11
ShowFps = KEY_F11

# NAOMI cabinets of several boards: the next board's picture; default: KEY_F10
NextScreen = KEY_F10

# P<n>_GUID = an SDL joystick GUID: that controller is player n's, JOY<n-1>,
# whatever order Windows lists them in (hikaruloader.log gives the GUIDs).
# P<n>_Profiled = the controller whose profile (data/devices, devices/) was
# put on player n's bindings, once: removed, it is put again
[ControllerGUIDs]
